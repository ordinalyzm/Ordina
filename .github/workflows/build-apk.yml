name: Build & Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Assets (Vite)
        run: npm run build

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Build Android APK (Debug / Release)
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename and Prepare APK
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/Ordina-Mesh.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/Ordina-latest.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ordina-apk
          path: build-output/Ordina-Mesh.apk

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ github.ref_name == 'main' && 'latest' || github.ref_name }}
          name: ${{ github.ref_name == 'main' && 'Ordina Mesh Latest Build' || github.ref_name }}
          body: |
            Автоматическая сборка Ordina Mesh.
            - Прямая установка без VPN
            - Встроенный Bluetooth / Wi-Fi Mesh
            - Дата сборки: ${{ github.event.head_commit.timestamp || 'Auto' }}
          draft: false
          prerelease: false
          files: |
            build-output/Ordina-Mesh.apk
            build-output/Ordina-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
