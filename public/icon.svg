<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0f0f0" />
    </linearGradient>
    <linearGradient id="sword" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="chain" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9ca3af" />
      <stop offset="100%" stop-color="#4b5563" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3" />
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="120" fill="url(#bg)" />
  
  <!-- Left Chain -->
  <g filter="url(#shadow)">
    <path d="M 0 160 C 40 160, 80 160, 120 160 C 140 160, 160 140, 160 120 C 160 100, 140 80, 120 80 C 80 80, 40 80, 0 80" fill="none" stroke="url(#chain)" stroke-width="24" stroke-linecap="round" />
    <path d="M 120 160 C 160 160, 200 160, 220 160 C 230 160, 240 150, 240 140" fill="none" stroke="url(#chain)" stroke-width="24" stroke-linecap="round" />
    <ellipse cx="60" cy="120" rx="30" ry="16" fill="none" stroke="url(#chain)" stroke-width="16" />
    <ellipse cx="160" cy="120" rx="30" ry="16" fill="none" stroke="url(#chain)" stroke-width="16" />
  </g>

  <!-- Right Chain -->
  <g filter="url(#shadow)">
    <path d="M 512 160 C 472 160, 432 160, 392 160 C 372 160, 352 140, 352 120 C 352 100, 372 80, 392 80 C 432 80, 472 80, 512 80" fill="none" stroke="url(#chain)" stroke-width="24" stroke-linecap="round" />
    <path d="M 392 160 C 352 160, 312 160, 292 160 C 282 160, 272 150, 272 140" fill="none" stroke="url(#chain)" stroke-width="24" stroke-linecap="round" />
    <ellipse cx="452" cy="120" rx="30" ry="16" fill="none" stroke="url(#chain)" stroke-width="16" />
    <ellipse cx="352" cy="120" rx="30" ry="16" fill="none" stroke="url(#chain)" stroke-width="16" />
  </g>

  <!-- Broken links pieces -->
  <path d="M 230 110 L 250 90" stroke="url(#chain)" stroke-width="16" stroke-linecap="round" />
  <path d="M 280 110 L 260 90" stroke="url(#chain)" stroke-width="16" stroke-linecap="round" />

  <!-- Sword -->
  <g filter="url(#shadow)">
    <!-- Blade -->
    <path d="M 256 60 L 280 280 L 256 400 L 232 280 Z" fill="url(#sword)" />
    <path d="M 256 60 L 280 280 L 256 400 Z" fill="#fbbf24" opacity="0.6" />
    <!-- Crossguard -->
    <rect x="180" y="380" width="152" height="24" rx="8" fill="url(#sword)" />
    <circle cx="180" cy="392" r="16" fill="url(#sword)" />
    <circle cx="332" cy="392" r="16" fill="url(#sword)" />
    <!-- Handle -->
    <rect x="240" y="404" width="32" height="70" rx="4" fill="#b45309" />
    <!-- Pommel -->
    <circle cx="256" cy="480" r="20" fill="url(#sword)" />
  </g>

  <!-- Sparkles / Impact -->
  <g filter="url(#glow)" fill="#fbbf24">
    <circle cx="256" cy="60" r="8" />
    <circle cx="230" cy="40" r="4" />
    <circle cx="280" cy="40" r="5" />
    <circle cx="240" cy="80" r="3" />
    <circle cx="270" cy="80" r="4" />
    <path d="M 256 20 L 260 40 L 256 60 L 252 40 Z" />
    <path d="M 220 50 L 240 55 L 256 60 L 240 65 Z" />
    <path d="M 292 50 L 272 55 L 256 60 L 272 65 Z" />
  </g>
</svg>
